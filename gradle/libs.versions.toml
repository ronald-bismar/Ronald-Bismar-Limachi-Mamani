[versions]
agp = "9.4.1"
core = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleViewmodel = "2.11.0"
activity = "1.13.0"
material = "1.13.0"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
